<title>WorkJob · Clases</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@700;800&display=swap">
<style>/*__BASE_CSS__*/</style>
<style>
/* Clases: portada con temas por semana, dashboard por tema y una página por sesión. Usa los mismos tokens de la página de ofertas */
.nav a.lnk.on { color: var(--ink); border-bottom-color: var(--mint) }
.crumbs { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px }
.crumbs a { color: var(--muted); text-decoration: none }
.crumbs a:hover { color: var(--mint) }
.prog { display: flex; align-items: center; gap: 10px; font: 500 12.5px var(--mono); color: var(--muted) }
.prog .meter { flex: 1; height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; min-width: 80px }
.prog .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--mint)); border-radius: 999px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.card { padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink) }
.card:hover { border-color: var(--mint) }
.card h3 { margin: 0; font: 700 16px/1.3 var(--body) }
.card p { margin: 0; color: var(--muted); font-size: 13.5px }
.top { display: flex; flex-direction: column; gap: 12px }
.top h1 { font-size: clamp(26px, 5vw, 40px); text-align: left }
.top .lede { max-width: 70ch }
.intro p { margin: 0 0 10px; color: #c5cedb; max-width: 72ch }
.intro p:last-child { margin: 0 }
.goals { margin: 0; padding-left: 20px; color: #c5cedb; display: flex; flex-direction: column; gap: 4px }
.sess { list-style: none; margin: 0; padding: 0; overflow: hidden }
.sess li { border-bottom: 1px solid var(--line) }
.sess li:last-child { border-bottom: 0 }
.sess a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; color: var(--ink); text-decoration: none }
.sess a:hover { background: var(--panel-2) }
.sess .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--bg); border: 1px solid var(--line); color: var(--muted) }
.sess .done .n { background: var(--mint); border-color: var(--mint); color: var(--mint-ink) }
.sess .t { font-weight: 600 }
.sess .m { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap }
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.res .panel { padding: 16px; display: flex; flex-direction: column; gap: 10px }
.res h3 { margin: 0; font: 700 15px var(--body); display: flex; gap: 8px; align-items: center }
.item { display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.item:last-child { border-bottom: 0; padding-bottom: 0 }
.item a { font-weight: 600; text-decoration: none; overflow-wrap: anywhere }
.item a:hover { text-decoration: underline }
.item span { color: var(--muted); font-size: 13.5px }
.item .meta { font: 500 12px var(--mono); color: var(--muted) }
.lesson { padding: 20px; display: flex; flex-direction: column; gap: 14px }
.lesson p { margin: 0; color: #d3dae5; line-height: 1.65; max-width: 72ch }
.lesson h3 { margin: 6px 0 0; font: 700 15px var(--body); color: var(--mint) }
.lesson ul { margin: 0; padding-left: 20px; color: #c5cedb; display: flex; flex-direction: column; gap: 4px }
.lesson code, .intro code { font: 500 13px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--lav) }
.practice { background: rgba(47, 245, 200, .08); border: 1px solid rgba(47, 245, 200, .3); border-radius: 12px; padding: 12px 14px; color: var(--ink) }
.practice b { color: var(--mint) }
details.qa { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px }
details.qa + details.qa { margin-top: 8px }
details.qa summary { cursor: pointer; font-weight: 600; color: var(--ink) }
details.qa[open] summary { color: var(--mint); margin-bottom: 6px }
details.qa p { color: #c5cedb }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.pager a, .btn { font: 600 14px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; text-decoration: none; cursor: pointer }
.pager a:hover, .btn:hover { border-color: var(--mint) }
.btn.on { background: var(--mint); border-color: var(--mint); color: var(--mint-ink) }
.vid { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; overflow: hidden }
.tag.free { background: rgba(52, 211, 153, .18); color: var(--green) }
.tag.paid { background: rgba(245, 200, 75, .18); color: var(--yellow) }
</style>

<nav class="nav"><div class="nav-in">
  <a class="brand" href="index.html"><span class="logo" aria-hidden="true">WJ</span>WorkJob</a>
  <a class="lnk" href="index.html#ofertas">Ofertas</a>
  <a class="lnk" href="index.html#skills">Skills</a>
  <a class="lnk on" href="#">Clases</a>
</div></nav>

<div class="wrap" id="app"></div>

<script id="learn" type="application/json">/*__LEARN__*/null</script>
<script>
(function () {
  var L = JSON.parse(document.getElementById("learn").textContent) || { temas: [], pct: {} };
  var TEMAS = L.temas, BY_ID = {}; TEMAS.forEach(function (t) { BY_ID[t.id] = t; });
  var SEMANAS = [[1, "Semana 1 · APIs y LLMs"], [2, "Semana 2 · Python, SQL, RAG y agentes"], [3, "Semana 3 · Negocio, portafolio y postulación"], [0, "Durante las 3 semanas"]];
  var app = document.getElementById("app");

  // Progreso por sesión, solo en este navegador
  var done = {};
  try { done = JSON.parse(localStorage.getItem("wj-clases") || "{}") || {}; } catch (err) {}
  function saveDone() { try { localStorage.setItem("wj-clases", JSON.stringify(done)); } catch (err) {} }
  function count(t) { var n = 0; for (var i = 1; i <= t.sesiones.length; i++) if (done[t.id + "/" + i]) n++; return n; }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function a(href, text, cls, ext) { var n = el("a", cls, text); n.href = href; if (ext && /^https?:/.test(href)) { n.target = "_blank"; n.rel = "noopener"; } return n; }
  // Texto con `código` y párrafos separados por línea en blanco
  function rich(host, text, tag) {
    String(text).split(/\n\n+/).forEach(function (para) {
      var p = el(tag || "p");
      para.split(/(`[^`]+`)/).forEach(function (part) {
        if (/^`[^`]+`$/.test(part)) p.appendChild(el("code", null, part.slice(1, -1)));
        else if (part) p.appendChild(document.createTextNode(part));
      });
      host.appendChild(p);
    });
  }
  function prog(n, total) {
    var d = el("div", "prog"), m = el("span", "meter"), i = el("i"); i.style.width = (total ? n / total * 100 : 0) + "%";
    m.appendChild(i); d.appendChild(m); d.appendChild(el("span", null, n + "/" + total + " sesiones")); return d;
  }
  function crumbs(parts) {
    var c = el("div", "crumbs");
    parts.forEach(function (p, i) { if (i) c.appendChild(el("span", null, "/")); c.appendChild(p[1] ? a(p[1], p[0]) : el("span", null, p[0])); });
    return c;
  }
  function pctTag(t) { var p = L.pct[t.skill]; return p != null ? el("span", "tag skill", "Lo piden " + Math.round(p) + " % de las ofertas") : null; }
  function minutes(t) { return t.sesiones.reduce(function (s, x) { return s + (x.min || 0); }, 0); }
  function hours(m) { return String(Math.round(m / 30) / 2).replace(".", ",") + " h"; }

  function home() {
    var top = el("header", "top");
    top.appendChild(el("div", "eyebrow", "// Clases"));
    top.appendChild(el("h1", null, "Aprende lo que piden las ofertas"));
    var all = TEMAS.reduce(function (s, t) { return s + t.sesiones.length; }, 0), ok = TEMAS.reduce(function (s, t) { return s + count(t); }, 0);
    top.appendChild(el("p", "lede", TEMAS.length + " temas de 8 sesiones cada uno, en el orden del plan de 3 semanas. Cada tema trae su introducción, clases con preguntas y respuestas, las herramientas que necesitas, cursos gratis y de pago, y repositorios para practicar."));
    top.appendChild(prog(ok, all));
    app.appendChild(top);
    SEMANAS.forEach(function (s) {
      var list = TEMAS.filter(function (t) { return t.semana === s[0]; });
      if (!list.length) return;
      var sec = el("section"); sec.appendChild(el("h2", null, s[1]));
      var grid = el("div", "cards");
      list.forEach(function (t) {
        var c = a("#" + t.id, null, "panel card");
        c.appendChild(el("h3", null, t.titulo));
        c.appendChild(el("p", null, t.resumen));
        var tags = el("div", "tags"); var pt = pctTag(t); if (pt) tags.appendChild(pt);
        tags.appendChild(el("span", "tag", "8 sesiones · " + hours(minutes(t))));
        if (t.video) tags.appendChild(el("span", "tag fit mid", "▶ Video resumen"));
        c.appendChild(tags);
        c.appendChild(prog(count(t), t.sesiones.length));
        grid.appendChild(c);
      });
      sec.appendChild(grid); app.appendChild(sec);
    });
  }

  function resBox(title, items, render) {
    var p = el("div", "panel"); p.appendChild(el("h3", null, title));
    items.forEach(function (it) { p.appendChild(render(it)); });
    return p;
  }
  function tema(t) {
    var top = el("header", "top");
    top.appendChild(crumbs([["Clases", "#"], [t.titulo]]));
    top.appendChild(el("h1", null, t.titulo));
    var tags = el("div", "tags"); var pt = pctTag(t); if (pt) tags.appendChild(pt);
    tags.appendChild(el("span", "tag cat", t.semana ? "Semana " + t.semana : "Las 3 semanas"));
    tags.appendChild(el("span", "tag", "8 sesiones · " + hours(minutes(t)))); top.appendChild(tags);
    top.appendChild(prog(count(t), t.sesiones.length));
    app.appendChild(top);

    if (t.video) {
      var vs = el("section"); vs.appendChild(el("h2", null, "Video resumen"));
      var v = el("video", "panel vid"); v.controls = true; v.preload = "none"; v.playsInline = true;
      v.poster = "videos/" + t.id + ".jpg";
      if (t.video === "notebooklm") v.src = "videos/notebooklm/" + t.id + ".mp4";
      else {
        v.src = "videos/" + t.id + ".mp4";
        var tr = el("track"); tr.kind = "subtitles"; tr.srclang = "es"; tr.label = "Español"; tr.src = "videos/" + t.id + ".vtt"; v.appendChild(tr);
      }
      vs.appendChild(v);
      vs.appendChild(el("p", "sec-note", t.video === "notebooklm"
        ? "Video explicativo del tema, generado con NotebookLM de Google a partir del contenido de estas clases."
        : "Un recorrido de unos 5 minutos por las 8 sesiones del tema, con subtítulos. Voz generada por computadora."));
      app.appendChild(vs);
    }

    var intro = el("section"); intro.appendChild(el("h2", null, "Introducción"));
    var ib = el("div", "intro"); rich(ib, t.intro); intro.appendChild(ib);
    intro.appendChild(el("h3", null, "Al terminar podrás"));
    var g = el("ul", "goals"); t.objetivos.forEach(function (o) { g.appendChild(el("li", null, o)); }); intro.appendChild(g);
    app.appendChild(intro);

    var ss = el("section"); ss.appendChild(el("h2", null, "Sesiones"));
    var ul = el("ul", "panel sess");
    t.sesiones.forEach(function (s, i) {
      var li = el("li", done[t.id + "/" + (i + 1)] ? "done" : null), l = a("#" + t.id + "/" + (i + 1));
      l.appendChild(el("span", "n", String(i + 1))); l.appendChild(el("span", "t", s.t)); l.appendChild(el("span", "m", s.min + " min"));
      li.appendChild(l); ul.appendChild(li);
    });
    ss.appendChild(ul); app.appendChild(ss);

    var rs = el("section"); rs.appendChild(el("h2", null, "Herramientas, cursos y repositorios"));
    var grid = el("div", "res");
    grid.appendChild(resBox("Herramientas y programas", t.herramientas, function (h) {
      var d = el("div", "item"); d.appendChild(a(h.u, h.n, null, true)); d.appendChild(el("span", null, h.para));
      d.appendChild(el("span", "meta", h.costo)); return d;
    }));
    function course(c) {
      var d = el("div", "item"); d.appendChild(a(c.u, c.n, null, true));
      d.appendChild(el("span", null, c.para || ""));
      d.appendChild(el("span", "meta", [c.plataforma, c.idioma, c.duracion].filter(Boolean).join(" · "))); return d;
    }
    var free = t.cursos.filter(function (c) { return c.costo === "gratis"; }), paid = t.cursos.filter(function (c) { return c.costo !== "gratis"; });
    var fb = resBox("Cursos gratis", free, course); fb.querySelector("h3").appendChild(el("span", "tag free", String(free.length))); grid.appendChild(fb);
    var pb = resBox("Cursos de pago", paid, course); pb.querySelector("h3").appendChild(el("span", "tag paid", String(paid.length))); grid.appendChild(pb);
    grid.appendChild(resBox("Repositorios en GitHub", t.repos, function (r) {
      var d = el("div", "item"); d.appendChild(a(r.u, r.u.replace("https://github.com/", ""), null, true)); d.appendChild(el("span", null, r.para));
      if (r.stars) d.appendChild(el("span", "meta", "★ " + (r.stars >= 1000 ? Math.round(r.stars / 100) / 10 + "k" : r.stars))); return d;
    }));
    rs.appendChild(grid); app.appendChild(rs);
  }

  function sesion(t, n) {
    var s = t.sesiones[n - 1], key = t.id + "/" + n;
    var top = el("header", "top");
    top.appendChild(crumbs([["Clases", "#"], [t.titulo, "#" + t.id], ["Sesión " + n]]));
    top.appendChild(el("div", "eyebrow", "Sesión " + n + " de " + t.sesiones.length + " · " + s.min + " min"));
    top.appendChild(el("h1", null, s.t));
    app.appendChild(top);

    var box = el("article", "panel lesson");
    rich(box, s.texto);
    box.appendChild(el("h3", null, "Conceptos clave"));
    var cl = el("ul"); s.claves.forEach(function (k) { rich(cl, k, "li"); }); box.appendChild(cl);
    var pr = el("div", "practice"); pr.appendChild(el("b", null, "Práctica: ")); pr.appendChild(document.createTextNode(s.practica)); box.appendChild(pr);
    box.appendChild(el("h3", null, "Preguntas y respuestas"));
    var qs = el("div");
    s.preguntas.forEach(function (q) { var d = el("details", "qa"); d.appendChild(el("summary", null, q.q)); rich(d, q.a); qs.appendChild(d); });
    box.appendChild(qs);
    if (s.links && s.links.length) {
      box.appendChild(el("h3", null, "Para profundizar"));
      var ll = el("ul"); s.links.forEach(function (k) { var li = el("li"); li.appendChild(a(k.u, k.n, null, true)); ll.appendChild(li); }); box.appendChild(ll);
    }
    var btn = el("button", "btn" + (done[key] ? " on" : ""), done[key] ? "✓ Sesión completada" : "Marcar como completada"); btn.type = "button";
    btn.addEventListener("click", function () { if (done[key]) delete done[key]; else done[key] = 1; saveDone(); route(); });
    box.appendChild(btn);
    app.appendChild(box);

    var pg = el("div", "pager");
    pg.appendChild(n > 1 ? a("#" + t.id + "/" + (n - 1), "← Sesión " + (n - 1)) : a("#" + t.id, "← Volver al tema"));
    pg.appendChild(n < t.sesiones.length ? a("#" + t.id + "/" + (n + 1), "Sesión " + (n + 1) + " →") : a("#" + t.id, "Terminar el tema →"));
    app.appendChild(pg);
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, "").split("/"), t = BY_ID[h[0]], n = +h[1];
    app.textContent = "";
    if (t && n >= 1 && n <= t.sesiones.length) sesion(t, n);
    else if (t) tema(t);
    else home();
    document.title = (t ? t.titulo + " · " : "") + "WorkJob · Clases";
  }
  window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
  route();
})();
</script>
