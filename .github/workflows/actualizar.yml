name: Actualizar ofertas

on:
  schedule:
    # Cada 3 horas, al minuto 17 para evitar la congestión de GitHub en hora en punto. En hora de Perú: 1:17, 4:17, 7:17 y 10:17 de la mañana y de la tarde
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar ofertas
        run: node scripts/fetch.mjs
      - name: Generar la página
        run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
